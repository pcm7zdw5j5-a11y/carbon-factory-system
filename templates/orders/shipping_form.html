{% extends "base.html" %}
{% block title %}填写快递信息 - {{ order.order_no }}{% endblock %}
{% block content %}
<section class="page-head">
    <div>
        <h1>填写快递信息</h1>
        <p>{{ order.order_no }} · {{ order.customer_name }} · {{ order.product_name }}</p>
    </div>
    <a class="button secondary" href="{{ cancel_url }}">取消返回</a>
</section>

<section class="panel">
    <div class="section-title">
        <div>
            <h2>发货信息</h2>
            <p>快递单号可以稍后补填，订单状态会保持为“已发货”。</p>
        </div>
        <span class="tag status-badge" data-status="{{ order.status }}">{{ order.status }}</span>
    </div>

    <form class="form-grid shipping-form" method="post" action="{{ url_for('main.order_shipping_update', order_id=order.id) }}">
        <input type="hidden" name="return_to" value="{{ return_to or 'detail' }}">

        <label>快递公司
            <select name="shipping_company">
                <option value="">请选择快递公司</option>
                {% for company in shipping_companies %}
                    <option value="{{ company }}" {% if order.shipping_company == company %}selected{% endif %}>{{ company }}</option>
                {% endfor %}
            </select>
        </label>

        <label>快递单号
            <input name="tracking_number" value="{{ order.tracking_number or '' }}" placeholder="可稍后补填">
        </label>

        <label>运费
            <input type="number" step="0.01" name="shipping_freight" value="{{ order.shipping_freight or 0 }}">
        </label>

        <label>发货时间
            <input name="shipped_at" value="{{ order.shipped_at or '' }}" placeholder="不填则自动使用当前时间">
        </label>

        <label class="full-width">发货备注
            <textarea name="shipping_note" rows="4" placeholder="例如：客户要求放门卫、稍后补单号等">{{ order.shipping_note or '' }}</textarea>
        </label>

        <div class="form-actions full-width">
            <button class="button primary" type="submit">保存快递信息</button>
            <a class="button secondary" href="{{ cancel_url }}">取消返回</a>
        </div>
    </form>
</section>
{% endblock %}
